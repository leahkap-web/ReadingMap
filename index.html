<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מנהל פדגוגי מקוון</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Assistant', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="root">
        <!-- Loader during initialization -->
        <div class="flex items-center justify-center min-h-screen">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-800"></div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, query, deleteDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import React, { useState, useEffect } from "https://esm.sh/react@18.2.0";
        import ReactDOM from "https://esm.sh/react-dom@18.2.0/client";

        // Global Configuration
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'pedagogic-manager-v1';
        const apiKey = ""; // Provided by environment at runtime

        // --- Icons Component ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                BookOpen: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
                Share2: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>`,
                Trash2: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`,
                PlusCircle: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>`,
                LayoutDashboard: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>`,
                Brain: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-1.96-3.04 2.5 2.5 0 0 1 .39-4.9 2.5 2.5 0 0 1 .39-4.9 2.5 2.5 0 0 1 1.96-3.04 2.5 2.5 0 0 1 1.72-.06Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 1.96-3.04 2.5 2.5 0 0 0-.39-4.9 2.5 2.5 0 0 0-.39-4.9 2.5 2.5 0 0 0-1.96-3.04 2.5 2.5 0 0 0-1.72-.06Z"/></svg>`,
                Sparkles: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>`,
                MessageSquare: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
                User: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
                X: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`
            };
            return React.createElement('span', {
                dangerouslySetInnerHTML: { __html: icons[name] },
                className: className
            });
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('data-entry');
            const [students, setStudents] = useState([]);
            const [isSharing, setIsSharing] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);
            const [selectedNote, setSelectedNote] = useState(null);
            const [formData, setFormData] = useState({
                name: '', fluency: 'בינוני', readingType: 'רגילה', vowelDifficulties: [], comprehension: 'יש', manualNote: ''
            });

            // Authentication Setup
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        console.error("Auth failed", error);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // Data Synchronization
            useEffect(() => {
                if (!user) return;
                const q = collection(db, 'artifacts', appId, 'public', 'data', 'students');
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const studentList = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    setStudents(studentList);
                }, (error) => console.error("Firestore error:", error));
                return () => unsubscribe();
            }, [user]);

            // Gemini AI Logic
            const generateAINote = async (data, retries = 0) => {
                const systemPrompt = "את מורה מומחית להוראה מתקנת. תפקידך לכתוב משפט אחד קצר ומקצועי לתעודה המבוסס על נתוני הקריאה של התלמידה. השתמשי בלשון נקבה.";
                const userQuery = `שם התלמידה: ${data.name}. שטף: ${data.fluency}. שיטה: ${data.readingType}. קושי בתנועות: ${data.vowelDifficulties.join(', ') || 'אין'}. הבנה: ${data.comprehension}. כתבי הערה חיובית ומקצועית אחת קצרה לתעודה.`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });
                    
                    if (!response.ok && retries < 5) {
                        await new Promise(r => setTimeout(r, Math.pow(2, retries) * 1000));
                        return generateAINote(data, retries + 1);
                    }
                    const result = await response.json();
                    return result.candidates?.[0]?.content?.parts?.[0]?.text || "חל שיפור במיומנויות הקריאה.";
                } catch (err) {
                    if (retries < 5) {
                        await new Promise(r => setTimeout(r, Math.pow(2, retries) * 1000));
                        return generateAINote(data, retries + 1);
                    }
                    return "חל שיפור במיומנויות הקריאה.";
                }
            };

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const toggleVowel = (vowel) => {
                setFormData(prev => ({
                    ...prev,
                    vowelDifficulties: prev.vowelDifficulties.includes(vowel)
                        ? prev.vowelDifficulties.filter(v => v !== vowel)
                        : [...prev.vowelDifficulties, vowel]
                }));
            };

            const saveStudent = async (e) => {
                e.preventDefault();
                if (!formData.name || !user) return;
                setIsGenerating(true);
                try {
                    const aiNote = await generateAINote(formData);
                    const studentId = Date.now().toString();
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', studentId), {
                        ...formData,
                        aiNote: aiNote,
                        createdAt: new Date().toISOString(),
                        createdBy: user.uid
                    });
                    setFormData({ name: '', fluency: 'בינוני', readingType: 'רגילה', vowelDifficulties: [], comprehension: 'יש', manualNote: '' });
                } catch (err) {
                    console.error("Save error", err);
                } finally {
                    setIsGenerating(false);
                }
            };

            const deleteStudent = async (id) => {
                if (!user) return;
                try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id)); }
                catch (err) { console.error("Delete error", err); }
            };

            const copyShareLink = () => {
                document.execCommand('copy');
                navigator.clipboard?.writeText(window.location.href);
                setIsSharing(true);
                setTimeout(() => setIsSharing(false), 2000);
            };

            const vowels = ['קמץ/פתח', 'צירי/סגול', 'חיריק', 'חולם', 'שורוק/קובוץ', 'שוא'];

            return React.createElement('div', { className: "min-h-screen" },
                // Modal
                selectedNote && React.createElement('div', { className: "fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm" },
                    React.createElement('div', { className: "bg-white w-full max-w-md rounded-[2.5rem] shadow-2xl overflow-hidden" },
                        React.createElement('div', { className: "bg-gradient-to-l from-blue-700 to-indigo-700 p-6 flex justify-between items-center text-white" },
                            React.createElement('div', { className: "flex items-center gap-2" },
                                React.createElement(Icon, { name: "Sparkles", size: 20, className: "text-blue-200" }),
                                React.createElement('h3', { className: "font-bold text-xl" }, "הערות פדגוגיות")
                            ),
                            React.createElement('button', { onClick: () => setSelectedNote(null) }, React.createElement(Icon, { name: "X", size: 24 }))
                        ),
                        React.createElement('div', { className: "p-8 space-y-6" },
                            React.createElement('div', null,
                                React.createElement('p', { className: "text-slate-500 text-xs font-bold mb-3 uppercase" }, `עבור התלמידה: ${selectedNote.name}`),
                                React.createElement('div', { className: "space-y-4" },
                                    React.createElement('div', { className: "bg-blue-50 border-r-4 border-blue-500 p-4 rounded-xl" },
                                        React.createElement('div', { className: "flex items-center gap-2 mb-2 text-blue-700 text-xs font-bold" }, 
                                            React.createElement(Icon, { name: "Sparkles", size: 14 }), "הערת AI לתעודה"
                                        ),
                                        React.createElement('p', { className: "italic" }, `"${selectedNote.note}"`)
                                    ),
                                    selectedNote.manual && React.createElement('div', { className: "bg-slate-50 border-r-4 border-slate-400 p-4 rounded-xl" },
                                        React.createElement('div', { className: "flex items-center gap-2 mb-2 text-slate-600 text-xs font-bold" }, 
                                            React.createElement(Icon, { name: "User", size: 14 }), "הערה אישית שלך"
                                        ),
                                        React.createElement('p', null, selectedNote.manual)
                                    )
                                )
                            ),
                            React.createElement('button', { onClick: () => setSelectedNote(null), className: "w-full bg-slate-100 py-3 rounded-2xl font-bold" }, "סגור")
                        )
                    )
                ),
                // Nav
                React.createElement('nav', { className: "bg-blue-800 text-white p-4 shadow-lg sticky top-0 z-50" },
                    React.createElement('div', { className: "container mx-auto flex justify-between items-center" },
                        React.createElement('h1', { className: "text-xl font-bold flex items-center gap-2" }, React.createElement(Icon, { name: "BookOpen" }), "מנהל פדגוגי מקוון"),
                        React.createElement('button', { onClick: copyShareLink, className: `px-4 py-2 rounded-xl text-sm font-bold ${isSharing ? 'bg-green-600' : 'bg-blue-700'}` }, isSharing ? 'הועתק!' : 'שיתוף')
                    ),
                    React.createElement('div', { className: "container mx-auto mt-4 flex gap-1 bg-blue-900/50 p-1 rounded-2xl overflow-x-auto no-scrollbar" },
                        ['data-entry', 'dashboard', 'lesson-plan'].map(t => 
                            React.createElement('button', { 
                                key: t, 
                                onClick: () => setActiveTab(t),
                                className: `flex-1 py-2 px-4 rounded-xl whitespace-nowrap ${activeTab === t ? 'bg-white text-blue-800' : 'text-blue-100'}`
                            }, t === 'data-entry' ? 'הזנת נתונים' : t === 'dashboard' ? 'לוח בקרה' : 'תכנון ו-AI')
                        )
                    )
                ),
                // Main
                React.createElement('main', { className: "container mx-auto p-4 md:p-8 max-w-5xl" },
                    !user ? React.createElement('div', { className: "animate-spin h-8 w-8 border-b-2 border-blue-800 mx-auto" }) : (
                        activeTab === 'data-entry' ? React.createElement('div', { className: "grid md:grid-cols-3 gap-8" },
                            React.createElement('div', { className: "md:col-span-1" },
                                React.createElement('div', { className: "bg-white p-6 rounded-3xl shadow-sm border border-slate-100 sticky top-32" },
                                    React.createElement('h2', { className: "text-xl font-bold mb-6 flex items-center gap-2" }, React.createElement(Icon, { name: "PlusCircle", className: "text-blue-600" }), "תלמידה חדשה"),
                                    React.createElement('form', { onSubmit: saveStudent, className: "space-y-4" },
                                        React.createElement('input', { name: "name", required: true, value: formData.name, onChange: handleInputChange, className: "w-full p-3 bg-slate-50 rounded-xl outline-none", placeholder: "שם הבת..." }),
                                        React.createElement('div', { className: "grid grid-cols-2 gap-3" },
                                            React.createElement('select', { name: "fluency", value: formData.fluency, onChange: handleInputChange, className: "p-3 bg-slate-50 rounded-xl" }, 
                                                ['איטי', 'בינוני', 'מצוין'].map(opt => React.createElement('option', { key: opt }, opt))
                                            ),
                                            React.createElement('select', { name: "comprehension", value: formData.comprehension, onChange: handleInputChange, className: "p-3 bg-slate-50 rounded-xl" }, 
                                                ['יש', 'אין'].map(opt => React.createElement('option', { key: opt }, opt))
                                            )
                                        ),
                                        React.createElement('select', { name: "readingType", value: formData.readingType, onChange: handleInputChange, className: "w-full p-3 bg-slate-50 rounded-xl" },
                                            ['רגילה', 'מצרפת', 'גלובלית', 'מנחשת'].map(opt => React.createElement('option', { key: opt }, opt))
                                        ),
                                        React.createElement('div', { className: "flex flex-wrap gap-2" }, 
                                            vowels.map(v => React.createElement('button', { 
                                                type: "button", 
                                                key: v, 
                                                onClick: () => toggleVowel(v),
                                                className: `px-3 py-1.5 text-xs rounded-full border ${formData.vowelDifficulties.includes(v) ? 'bg-blue-100 border-blue-400 text-blue-700 font-bold' : 'bg-white text-slate-500'}`
                                            }, v))
                                        ),
                                        React.createElement('textarea', { name: "manualNote", value: formData.manualNote, onChange: handleInputChange, rows: "2", className: "w-full p-3 bg-slate-50 rounded-xl outline-none resize-none", placeholder: "הערה אישית שלך..." }),
                                        React.createElement('button', { disabled: isGenerating, type: "submit", className: "w-full bg-blue-800 text-white py-3 rounded-xl font-bold flex justify-center items-center gap-2" },
                                            isGenerating ? React.createElement('div', { className: "animate-spin h-5 w-5 border-2 border-white/30 border-t-white rounded-full" }) : [React.createElement(Icon, { name: "Sparkles", size: 18 }), "שמירה וניתוח AI"]
                                        )
                                    )
                                )
                            ),
                            React.createElement('div', { className: "md:col-span-2 space-y-4" },
                                React.createElement('h2', { className: "text-xl font-bold" }, `רשימת כיתה (${students.length})`),
                                students.length === 0 ? React.createElement('div', { className: "p-12 text-center text-slate-400" }, "טרם הוזנו נתונים.") : 
                                students.map(s => React.createElement('div', { key: s.id, className: "bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm" },
                                    React.createElement('div', { className: "flex items-center gap-4" },
                                        React.createElement('div', { className: "h-10 w-10 bg-blue-50 rounded-full flex items-center justify-center text-blue-600 font-bold" }, s.name.charAt(0)),
                                        React.createElement('div', null, React.createElement('h3', { className: "font-bold" }, s.name), React.createElement('span', { className: "text-xs text-slate-400" }, `שטף: ${s.fluency} | הבנה: ${s.comprehension}`))
                                    ),
                                    React.createElement('div', { className: "flex gap-2" },
                                        React.createElement('button', { onClick: () => setSelectedNote({ name: s.name, note: s.aiNote, manual: s.manualNote }), className: "bg-blue-50 text-blue-600 px-3 py-2 rounded-xl text-sm" }, "צפי בהערות"),
                                        React.createElement('button', { onClick: () => deleteStudent(s.id), className: "text-slate-300 hover:text-red-500 p-2" }, React.createElement(Icon, { name: "Trash2", size: 18 }))
                                    )
                                ))
                            )
                        ) : activeTab === 'dashboard' ? React.createElement('div', { className: "grid grid-cols-1 md:grid-cols-2 gap-6" },
                            React.createElement('div', { className: "bg-blue-800 text-white p-8 rounded-3xl relative overflow-hidden" },
                                React.createElement('p', { className: "text-blue-200 text-sm" }, "סך תלמידות"),
                                React.createElement('h3', { className: "text-6xl font-black" }, students.length),
                                React.createElement(Icon, { name: "BookOpen", size: 120, className: "absolute -left-4 -bottom-4 text-blue-700/30 rotate-12" })
                            ),
                            React.createElement('div', { className: "bg-white p-8 rounded-3xl shadow-sm" },
                                React.createElement('h4', { className: "font-bold mb-6" }, "מצב הבנה כיתתי"),
                                React.createElement('div', { className: "flex justify-around items-end h-24" },
                                    ['יש', 'אין'].map(type => React.createElement('div', { key: type, className: "flex flex-col items-center gap-2 w-full" },
                                        React.createElement('div', { className: `text-3xl font-black ${type === 'יש' ? 'text-green-600' : 'text-red-600'}` }, students.filter(s => s.comprehension === type).length),
                                        React.createElement('div', { className: `w-full max-w-[40px] rounded-t-lg ${type === 'יש' ? 'bg-green-100' : 'bg-red-100'}`, style: { height: students.length ? `${(students.filter(s => s.comprehension === type).length / students.length) * 100}%` : '0%' } }),
                                        React.createElement('div', { className: "text-[10px] font-bold text-slate-400" }, type === 'יש' ? 'הבנה מלאה' : 'דרוש תיווך')
                                    ))
                                )
                            )
                        ) : React.createElement('div', { className: "bg-white p-12 text-center rounded-[3rem]" },
                            React.createElement('div', { className: "bg-blue-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6" }, React.createElement(Icon, { name: "Brain", size: 40, className: "text-blue-600" })),
                            React.createElement('h3', { className: "text-2xl font-bold mb-4" }, "תובנות כיתתיות חכמות"),
                            React.createElement('button', { className: "bg-blue-800 text-white px-8 py-4 rounded-2xl font-bold" }, "ייצא הערות לתעודות")
                        )
                    )
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
