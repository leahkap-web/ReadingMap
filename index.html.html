<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מנהל פדגוגי חכם - הורדה</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Assistant', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- SVG Icons Components (Inline for stability) ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                BookOpen: (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                    </svg>
                ),
                Share2: (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                    </svg>
                ),
                Trash2: (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
                    </svg>
                ),
                LayoutDashboard: (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
                    </svg>
                ),
                PlusCircle: (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
                    </svg>
                ),
                BrainCircuit: (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M12 4.5a2.5 2.5 0 0 0-4.96-.46 2.5 2.5 0 0 0-1.98 3 2.5 2.5 0 0 0 .94 4.82 2.5 2.5 0 0 0 0 4.28 2.5 2.5 0 0 0-1.04 4.86 2.5 2.5 0 0 0 2 2.94A2.5 2.5 0 0 0 12 19.5"/><path d="M12 4.5a2.5 2.5 0 0 1 4.96-.46 2.5 2.5 0 0 1 1.98 3 2.5 2.5 0 0 1-.94 4.82 2.5 2.5 0 0 1 0 4.28 2.5 2.5 0 0 1 1.04 4.86 2.5 2.5 0 0 1-2 2.94A2.5 2.5 0 0 1 12 19.5"/>
                    </svg>
                )
            };
            return icons[name] || null;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('data-entry');
            const [students, setStudents] = useState([]);
            const [formData, setFormData] = useState({
                name: '', fluency: 'בינוני', readingType: 'רגילה', vowelDifficulties: [], comprehension: 'יש'
            });

            const vowels = ['קמץ/פתח', 'צירי/סגול', 'חיריק', 'חולם', 'שורוק/קובוץ', 'שוא'];

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const toggleVowel = (vowel) => {
                setFormData(prev => ({
                    ...prev,
                    vowelDifficulties: prev.vowelDifficulties.includes(vowel)
                        ? prev.vowelDifficulties.filter(v => v !== vowel)
                        : [...prev.vowelDifficulties, vowel]
                }));
            };

            const saveStudent = (e) => {
                e.preventDefault();
                if (!formData.name) return;
                const newStudent = { ...formData, id: Date.now().toString() };
                setStudents([...students, newStudent]);
                setFormData({ name: '', fluency: 'בינוני', readingType: 'רגילה', vowelDifficulties: [], comprehension: 'יש' });
            };

            const deleteStudent = (id) => {
                setStudents(students.filter(s => s.id !== id));
            };

            const exportToCSV = () => {
                if (students.length === 0) return;
                const headers = ["שם תלמיד", "שטף קריאה", "סוג קריאה", "קושי בתנועות", "הבנת הנקרא"];
                const rows = students.map(s => [s.name, s.fluency, s.readingType, s.vowelDifficulties.join('; '), s.comprehension]);
                const csvContent = "\uFEFF" + [headers, ...rows].map(e => e.join(",")).join("\n");
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `נתוני_כיתה.csv`;
                link.click();
            };

            return (
                <div className="min-h-screen">
                    <nav className="bg-blue-800 text-white p-4 shadow-lg sticky top-0 z-50">
                        <div className="container mx-auto flex justify-between items-center px-4">
                            <div className="flex items-center gap-2">
                                <h1 className="text-xl font-bold flex items-center gap-2">
                                    <Icon name="BookOpen" /> מנהל פדגוגי חכם
                                </h1>
                            </div>
                            <button className="bg-blue-700 px-4 py-2 rounded-xl text-sm flex items-center gap-2">
                                <Icon name="Share2" size={16} /> שיתוף
                            </button>
                        </div>
                        <div className="container mx-auto mt-4 flex gap-1 bg-blue-900/50 p-1 rounded-2xl overflow-x-auto no-scrollbar">
                            <button onClick={() => setActiveTab('data-entry')} className={`flex-1 py-2 rounded-xl transition-all ${activeTab === 'data-entry' ? 'bg-white text-blue-800 shadow-md' : 'text-blue-100'}`}>הזנת נתונים</button>
                            <button onClick={() => setActiveTab('dashboard')} className={`flex-1 py-2 rounded-xl transition-all ${activeTab === 'dashboard' ? 'bg-white text-blue-800 shadow-md' : 'text-blue-100'}`}>לוח בקרה</button>
                            <button onClick={() => setActiveTab('lesson-plan')} className={`flex-1 py-2 rounded-xl transition-all ${activeTab === 'lesson-plan' ? 'bg-white text-blue-800 shadow-md' : 'text-blue-100'}`}>תכנון ו-AI</button>
                        </div>
                    </nav>

                    <main className="container mx-auto p-4 md:p-8 max-w-5xl">
                        {activeTab === 'data-entry' && (
                            <div className="grid md:grid-cols-3 gap-8">
                                <div className="md:col-span-1">
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                        <h2 className="text-xl font-bold mb-6 flex items-center gap-2">תלמיד חדש</h2>
                                        <form onSubmit={saveStudent} className="space-y-4">
                                            <input type="text" name="name" required value={formData.name} onChange={handleInputChange} className="w-full p-3 bg-slate-50 rounded-xl" placeholder="שם התלמיד" />
                                            <div className="grid grid-cols-2 gap-3">
                                                <div>
                                                    <label className="text-xs text-slate-400">שטף קריאה</label>
                                                    <select name="fluency" value={formData.fluency} onChange={handleInputChange} className="w-full p-3 bg-slate-50 rounded-xl">
                                                        <option>איטי</option><option>בינוני</option><option>מצוין</option>
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="text-xs text-slate-400">הבנת הנקרא</label>
                                                    <select name="comprehension" value={formData.comprehension} onChange={handleInputChange} className="w-full p-3 bg-slate-50 rounded-xl">
                                                        <option>יש</option><option>אין</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <select name="readingType" value={formData.readingType} onChange={handleInputChange} className="w-full p-3 bg-slate-50 rounded-xl">
                                                <option>רגילה</option><option>מצרפת</option><option>גלובלית</option><option>מנחשת</option>
                                            </select>
                                            <div className="flex flex-wrap gap-2">
                                                {vowels.map(v => (
                                                    <button key={v} type="button" onClick={() => toggleVowel(v)} className={`px-3 py-1 text-xs rounded-full border ${formData.vowelDifficulties.includes(v) ? 'bg-blue-100 border-blue-400 text-blue-700' : 'bg-white text-slate-500'}`}>{v}</button>
                                                ))}
                                            </div>
                                            <button type="submit" className="w-full bg-blue-800 text-white py-3 rounded-xl font-bold">שמור במערכת</button>
                                        </form>
                                    </div>
                                </div>
                                <div className="md:col-span-2 space-y-4">
                                    <div className="flex justify-between items-center">
                                        <h2 className="text-xl font-bold">רשימת תלמידים ({students.length})</h2>
                                        <button onClick={exportToCSV} className="text-blue-600 text-sm flex items-center gap-1 font-medium">ייצוא CSV</button>
                                    </div>
                                    {students.length === 0 ? (
                                        <div className="bg-white p-12 text-center rounded-3xl border border-dashed text-slate-400">טרם הוזנו תלמידים</div>
                                    ) : (
                                        <div className="grid gap-3">
                                            {students.map(s => (
                                                <div key={s.id} className="bg-white p-4 rounded-2xl shadow-sm border flex justify-between items-center group">
                                                    <div>
                                                        <h3 className="font-bold">{s.name}</h3>
                                                        <p className="text-xs text-slate-500">שטף: {s.fluency} | סוג: {s.readingType} | הבנה: {s.comprehension}</p>
                                                    </div>
                                                    <button onClick={() => deleteStudent(s.id)} className="text-red-400 p-2 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                                                        <Icon name="Trash2" size={18}/>
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                        
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-blue-800 text-white p-8 rounded-3xl shadow-lg">
                                        <p className="text-blue-100">סך תלמידים</p>
                                        <h3 className="text-5xl font-black">{students.length}</h3>
                                    </div>
                                    <div className="bg-white p-8 rounded-3xl border shadow-sm">
                                        <h4 className="font-bold mb-4">הבנת הנקרא</h4>
                                        <div className="flex justify-around text-center">
                                            <div><div className="text-3xl font-bold text-green-600">{students.filter(s => s.comprehension === 'יש').length}</div><div className="text-xs text-slate-400">עם הבנה</div></div>
                                            <div><div className="text-3xl font-bold text-red-600">{students.filter(s => s.comprehension === 'אין').length}</div><div className="text-xs text-slate-400">ללא הבנה</div></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'lesson-plan' && (
                            <div className="bg-white p-12 text-center rounded-3xl border border-dashed text-slate-400">
                                <Icon name="BrainCircuit" size={48} className="mx-auto mb-4 text-slate-200" />
                                <p>גרסה זו תומכת בניהול נתונים מקומי. לשימוש ביכולות AI יש להריץ את הגרסה המקוונת.</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
